<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎬 Movie Explorer</h1>
    <p>Search and explore your favorite movies</p>
</header>

<div class="container">

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for a movie...">
        <button onclick="searchMovies()">Search</button>
    </div>

    <div class="filters">
        <button onclick="showMovies('all')">All</button>
        <button onclick="showMovies('action')">Action</button>
        <button onclick="showMovies('comedy')">Comedy</button>
        <button onclick="showMovies('drama')">Drama</button>
    </div>

    <div id="loading">Loading movies...</div>

    <div id="error"></div>

    <div id="movieContainer" class="movie-grid"></div>

</div>

<div id="movieModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modalPoster" src="" alt="Movie Poster">
        <div>
            <h2 id="modalTitle"></h2>
            <p id="modalYear"></p>
            <p id="modalGenre"></p>
            <p id="modalRating"></p>
            <p id="modalDescription"></p>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
